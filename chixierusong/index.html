<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>《持械入宋》人物关系图谱 - 现代特战×宋末军政博弈交互图谱</title>
  <meta name="description" content="《持械入宋》全景交互式人物关系图谱：现代五人特战突击小队、清河根据地、汴梁情报网、岳飞微末结盟与金夏重骑跨时代对决。">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 动态网格背景 -->
  <div id="ambient-bg"></div>

  <!-- 顶部导航与多维控制栏 -->
  <header class="top-navbar">
    <div class="brand-section">
      <a href="/" class="back-home-btn" title="返回牦牛路过个人主页">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>主页</span>
      </a>
      <div class="brand-title">
        <h1>《持械入宋》</h1>
        <span class="brand-badge">全景战略关系谱</span>
      </div>
    </div>

    <!-- 叙事阶段动态切换 -->
    <nav class="phase-nav">
      <button class="phase-tab active" data-phase="all">全景人物网</button>
      <button class="phase-tab" data-phase="phase1">S1 清河初创</button>
      <button class="phase-tab" data-phase="phase2">S2 汴梁暗流</button>
      <button class="phase-tab" data-phase="phase3">S3 关中血仇</button>
      <button class="phase-tab" data-phase="phase4">S4 边关决战</button>
    </nav>

    <!-- 实时搜索框 -->
    <div class="search-wrapper">
      <div class="search-input-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="搜索人物（如林昭、秦红缨、岳飞）..." autocomplete="off">
        <span class="search-shortcut">/</span>
      </div>
      <div class="search-dropdown" id="search-dropdown"></div>
    </div>
  </header>

  <!-- 关系图主画布容器 -->
  <main id="graph-container"></main>

  <!-- 底部阵营图例与悬浮操作坞 -->
  <footer class="bottom-panel">
    <div class="legend-wrapper">
      <div class="legend-header">
        <span>战略阵营谱系 (点击单选过滤)</span>
        <span>北宋 · 宣和/靖康年间</span>
      </div>
      <div class="legend-chips" id="legend-chips"></div>
    </div>

    <div class="floating-dock">
      <button class="dock-btn" id="btn-epic-standoff" title="查看 16:9 边塞大决战高清全景配图">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>
      <button class="dock-btn" id="btn-zoom-in" title="放大画布 (+)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="dock-btn" id="btn-zoom-out" title="缩小画布 (-)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="dock-btn" id="btn-reset-view" title="居中全览">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>
      <button class="dock-btn" id="btn-toggle-physics" title="锁定/解锁物理布局">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </button>
      <button class="dock-btn" id="btn-toggle-fullscreen" title="全屏沉浸浏览">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </footer>

  <!-- 右侧详情抽屉 (Slide-Over Drawer) -->
  <aside class="detail-drawer" id="detail-drawer">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <h2 class="drawer-name" id="drawer-name">林昭</h2>
        <span class="drawer-faction-tag" id="drawer-faction">现代特战五人组</span>
      </div>
      <button class="drawer-close-btn" id="drawer-close-btn" title="关闭详情">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-content">
      <!-- 战役存活/殉国状态 -->
      <div id="drawer-status"></div>

      <!-- 16:9 高清配图展示 -->
      <div id="drawer-media"></div>

      <!-- 角色语录 -->
      <div class="drawer-quote" id="drawer-quote"></div>

      <!-- 核心资产/装备 -->
      <div>
        <div class="drawer-section-title">核心战术装备与工业成果</div>
        <div class="assets-tag-list" id="drawer-assets"></div>
      </div>

      <!-- 深度人物小传 -->
      <div>
        <div class="drawer-section-title">战略定位与人物传记</div>
        <div class="drawer-bio" id="drawer-bio"></div>
      </div>

      <!-- 关联羁绊网络 -->
      <div>
        <div class="drawer-section-title">关联羁绊与因果链</div>
        <div class="relations-list" id="drawer-relations"></div>
      </div>
    </div>
  </aside>

  <!-- 16:9 电影级配图放大灯箱 -->
  <div class="lightbox-modal" id="lightbox-modal">
    <div class="lightbox-content">
      <button class="lightbox-close-btn" id="lightbox-close-btn" title="关闭">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <img id="lightbox-img" src="" alt="大图预览">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <!-- 引入 D3 与业务数据及交互脚本 -->
  <script src="d3.v7.min.js"></script>
  <script src="data.js"></script>
  <script src="graph.js"></script>
</body>
</html>
